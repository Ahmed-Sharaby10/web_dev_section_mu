<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .header {
            padding: 16px 8%;
            background: #000;
            color: #fff;
        }

        .header h1 {
            margin: 0 0 12px;
        }

        nav ul {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        nav a {
            color: #fff;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            width: min(100% - 32px, 480px);
            margin: 48px auto;
            padding: 32px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 4px 16px rgb(0 0 0 / 10%);
        }

        h2 {
            margin: 0 0 8px;
            color: #000;
            text-align: center;
        }

        .intro {
            margin: 0 0 24px;
            color: #555;
            text-align: center;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font: inherit;
        }

        input:focus {
            border-color: #000;
            outline: 2px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 4px;
            background: #000;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: bold;
        }

        button:hover {
            background: #333;
        }

        .login-link {
            margin: 20px 0 0;
            text-align: center;
        }

        .login-link a {
            color: #000;
        }

        @media (max-width: 480px) {
            main {
                margin: 24px auto;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>HAZEM MAHMOUD</h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="lab1.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html" aria-current="page">Register</a></li>
                <li><a href="form.html">Tasks</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Create an account</h2>
        <p class="intro">Fill in your details to register</p>

        <form action="#" method="post">
            <div class="field">
                <label for="full-name">Full name</label>
                <input
                    type="text"
                    id="full-name"
                    name="full_name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <div class="field">
                <label for="confirm-password">Confirm password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit">Register</button>
        </form>

        <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>
    </main>

    <script>
        const password = document.getElementById("password");
        const confirmation = document.getElementById("confirm-password");

        function validatePasswordMatch() {
            confirmation.setCustomValidity(
                confirmation.value && confirmation.value !== password.value
                    ? "Passwords do not match."
                    : ""
            );
        }

        password.addEventListener("input", validatePasswordMatch);
        confirmation.addEventListener("input", validatePasswordMatch);
    </script>
</body>
</html>
