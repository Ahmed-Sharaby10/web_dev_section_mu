<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Hazem Mahmoud</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../index.html">HAZEM MAHMOUD</a>
        <nav aria-label="Main navigation">
            <ul class="nav-list">
                <li><a href="../index.html">Home</a></li>
                <li><a href="portal.html">Portal</a></li>
                <li><a href="tasks.html">Tasks</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html" aria-current="page">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-card">
        <h1>Create an account</h1>
        <p class="subtitle">Fill in your details to register</p>

        <form action="#" method="post">
            <div class="field">
                <label for="full-name">Full name</label>
                <input
                    type="text"
                    id="full-name"
                    name="full_name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <div class="field">
                <label for="confirm-password">Confirm password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="btn btn-full">Register</button>
        </form>

        <p class="form-footer-link">
            Already have an account? <a href="login.html">Log in</a>
        </p>
    </main>

    <footer class="site-footer">
        <span>&copy; 2026 Hazem Mahmoud &mdash; Web Dev Lab</span>
        <span>Register</span>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
