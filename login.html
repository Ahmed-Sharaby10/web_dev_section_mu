<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
            background: #f3f4f6;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: min(100%, 400px);
            padding: 32px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 8px 24px rgb(0 0 0 / 10%);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        .intro {
            margin: 0 0 24px;
            color: #6b7280;
            text-align: center;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font: inherit;
        }

        input:focus {
            border-color: #2563eb;
            outline: 2px solid #bfdbfe;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        .register {
            margin: 20px 0 0;
            text-align: center;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Welcome back</h1>
        <p class="intro">Log in to your account</p>

        <form action="#" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Log in</button>
        </form>

        <p class="register">Don't have an account? <a href="register.html">Register</a></p>
    </main>
</body>
</html>
